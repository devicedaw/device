<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS app icon grid: an 824 pt tile centred on the 1024 pt canvas, with the system's
       soft drop shadow. The mark is docs/art/mark.svg scaled onto the tile. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3060ff"/>
      <stop offset="1" stop-color="#2149e6"/>
    </linearGradient>
  </defs>
  <g transform="translate(100 100) scale(8.24)">
    <rect width="100" height="100" rx="22.5" fill="url(#tile)" filter="url(#shadow)"/>
    <path d="M20 50 C29 22 38 22 50 50 S71 78 80 50" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
