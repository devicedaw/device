[package]
name = "dstudio-app"
description = "Device desktop application (Slint shell + custom wgpu timeline)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "device-studio"
path = "src/main.rs"

[dependencies]
dstudio-core = { path = "../dstudio-core" }
dstudio-engine = { path = "../dstudio-engine" }
# Exact pins: Slint's wgpu interop is behind `unstable-wgpu-30` and is tied to a
# wgpu major (see docs/adr/0001-ui-rendering.md). `unstable-winit-030` is only
# used for the macOS transparent-titlebar window attributes hook.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
    "unstable-winit-030",
    "compat-1-2",
    "accessibility",
] }
wgpu = { version = "=30.0.1" }
bytemuck = { version = "=1.24.0", features = ["derive"] }
png = "=0.18.1"
pollster = "=0.4.0"
rfd = "0.15"
ureq = { version = "3", features = ["json", "platform-verifier"] }
flate2 = "1.1"
# Already in the tree; local date and time for Edit › Undo History.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
roxmltree = "0.21"
# MP3 export: LAME (LGPL), built from source; see engine/third_party_licenses.md.
mp3lame-encoder = "=0.3.0"
serde_json.workspace = true
serde.workspace = true
# The assistant's API key in the system keychain: Keychain (macOS), Credential Manager
# (Windows), Secret Service over zbus (Linux, pure Rust, no libdbus).
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
# Voice input (spec 024): speech recognition on this computer. whisper.cpp (MIT) is built from
# source with CMake; CPU only, no GPU backends. sha2 checks the downloaded model.
whisper-rs = { version = "=0.16.0", default-features = false }
sha2 = "0.10"

# Already in the tree; the crash reports' signal handler (src/crash.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Already in the tree through winit; autosave asks whether the session that left a backup is still running.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Already in the tree through winit/muda; used to turn off the menu items AppKit adds to Edit and View
# and to place the window buttons (window_buttons.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSDictionary", "NSString", "NSValue", "NSGeometry", "objc2-core-foundation"] }

[build-dependencies]
slint-build = "=1.18.1"

# The app icon in device-studio.exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
